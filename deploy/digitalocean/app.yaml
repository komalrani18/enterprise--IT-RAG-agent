# DigitalOcean App Platform spec.
# Deploy with:  doctl apps create --spec deploy/digitalocean/app.yaml
#
# Prerequisites:
#   1. Push this repo to GitHub (App Platform builds from a repo).
#   2. Use a managed Qdrant Cloud cluster (or any reachable Qdrant server) for
#      QDRANT_URL/QDRANT_API_KEY — App Platform containers are ephemeral, so the
#      embedded/local Qdrant file mode is not suitable for production here.
#   3. Fill in the secret env vars below via `doctl` or the App Platform dashboard
#      (mark them type SECRET so they're encrypted).

name: enterprise-it-rag
region: nyc

services:
  - name: backend
    github:
      repo: YOUR_GITHUB_USERNAME/YOUR_REPO
      branch: main
      deploy_on_push: true
    source_dir: /
    dockerfile_path: backend/Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xs
    routes:
      - path: /api
    envs:
      - key: LLM_PROVIDER
        value: "groq"
      - key: LLM_MODEL
        value: "llama-3.1-70b-versatile"
      - key: GROQ_API_KEY
        type: SECRET
      - key: EMBEDDING_PROVIDER
        value: "local"
      - key: QDRANT_URL
        type: SECRET
      - key: QDRANT_API_KEY
        type: SECRET
      - key: QDRANT_COLLECTION
        value: "it_policies"
      - key: TAVILY_API_KEY
        type: SECRET
      - key: TICKET_STORE_PATH
        value: "/app/tickets.json"

  - name: frontend
    github:
      repo: YOUR_GITHUB_USERNAME/YOUR_REPO
      branch: main
      deploy_on_push: true
    source_dir: /
    dockerfile_path: frontend/Dockerfile
    http_port: 8501
    instance_count: 1
    instance_size_slug: basic-xs
    routes:
      - path: /
    envs:
      - key: BACKEND_URL
        value: ${backend.PUBLIC_URL}

# After first deploy, run ingestion once via `doctl apps console` into the backend
# instance (or trigger the /ingest endpoint): `curl -X POST https://<backend-url>/ingest`
